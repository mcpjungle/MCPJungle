{{- if or .Values.admin.adminToken .Values.admin.initToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcpjungle.fullname" . }}-admin
  labels:
    {{- include "mcpjungle.labels" . | nindent 4 }}
  annotations:
    # Keep secret across helm upgrades — do not delete on uninstall
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if .Values.admin.adminToken }}
  admin-token: {{ .Values.admin.adminToken | quote }}
  {{- end }}
  {{- if .Values.admin.initToken }}
  init-token: {{ .Values.admin.initToken | quote }}
  {{- end }}
{{- end }}
