<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCPJungle Dashboard</title>
    <!-- Blocking: set data-theme before first paint (must stay in sync with src/lib/theme.ts). -->
    <script>
      (function () {
        var key = "mcpjungle-theme";
        var theme = "system";
        try {
          var stored = localStorage.getItem(key);
          if (stored === "light" || stored === "dark" || stored === "system") {
            theme = stored;
          }
        } catch (e) {}
        var resolved =
          theme === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
        document.documentElement.setAttribute("data-theme", resolved);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
